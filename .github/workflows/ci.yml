name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Lint (oxlint + jsx-a11y)
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Design tokens are up to date
        run: npm run tokens:build && git diff --exit-code -- src/styles/tokens.css
      - name: Design tokens meet WCAG AA and are used consistently
        run: npm run tokens:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest + axe)
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook

  commitlint:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # PRs are squash-merged, so the PR title becomes the commit message on main.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx --no -- commitlint
